<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Age Verification</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #111;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      width: 100%;
      height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box {
      width: 90%;
      max-width: 430px;

      background: #202020;

      padding: 35px;

      border-radius: 12px;

      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    p {
      color: #bbb;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    button {
      width: 100%;

      padding: 15px;

      margin-top: 12px;

      border: none;

      border-radius: 6px;

      font-size: 17px;

      cursor: pointer;
    }

    #enterButton {
      background: #e53935;
      color: white;
    }

    #exitButton {
      background: #444;
      color: white;
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="box">

      <h1>Age Verification</h1>

      <p>
        This website contains content intended for adults.
        Please confirm that you are 18 years of age or older.
      </p>

      <button id="enterButton">
        I am 18 or older
      </button>

      <button id="exitButton">
        I am under 18
      </button>

    </div>

  </div>


<script>

  /*
   * ==========================
   * 修改这里
   * ==========================
   */

  const MAIN_SITE =
    "https://www.xvideos.com/";

  const MY_LINK =
    "https://bushe.co/";


  /*
   * ==========================
   * 18+ BUTTON
   * ==========================
   */

  document
    .getElementById("enterButton")
    .addEventListener("click", function () {

      /*
       * 打开你的链接
       * 新标签页
       */

      window.open(
        MY_LINK,
        "_blank",
        "noopener"
      );


      /*
       * 当前页面进入主网站
       */

      window.location.href =
        MAIN_SITE;

    });


  /*
   * ==========================
   * UNDER 18
   * ==========================
   */

  document
    .getElementById("exitButton")
    .addEventListener("click", function () {

      if (window.history.length > 1) {

        window.history.back();

      } else {

        window.location.href =
          "https://www.google.com/";

      }

    });

</script>

</body>
</html>
