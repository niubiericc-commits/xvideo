<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Age Verification</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #111;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      width: 100%;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 430px;

      background: #202020;

      padding: 35px;

      border-radius: 12px;

      text-align: center;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 28px;
    }

    p {
      margin: 0 0 25px;

      color: #bbb;

      font-size: 16px;
      line-height: 1.6;
    }

    button {
      width: 100%;

      padding: 15px;

      margin-top: 12px;

      border: 0;
      border-radius: 6px;

      font-size: 17px;

      cursor: pointer;
    }

    #enterButton {
      background: #e53935;
      color: #fff;
    }

    #exitButton {
      background: #444;
      color: #fff;
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="box">

      <h1>Age Verification</h1>

      <p>
        This website contains content intended for adults.
        Please confirm that you are 18 years of age or older.
      </p>

      <button id="enterButton">
        I am 18 or older
      </button>

      <button id="exitButton">
        I am under 18
      </button>

    </div>

  </div>


<script>

  /*
   * ===============================
   * MAIN WEBSITE
   * ===============================
   */

  const MAIN_SITE =
    "https://www.xvideos.com/";


  /*
   * ===============================
   * YOUR SECOND LINK
   *
   * Replace this with your URL
   * ===============================
   */

  const MY_LINK =
    "https://bushe.co/";


  /*
   * ===============================
   * 18+ BUTTON
   * ===============================
   */

  document
    .getElementById("enterButton")
    .addEventListener("click", function () {

      /*
       * Open XVideos directly from
       * the user's click.
       */

      const mainWindow = window.open(
        MAIN_SITE,
        "_blank"
      );


      /*
       * If browser allows the new tab,
       * attempt to focus it.
       */

      if (mainWindow) {

        try {
          mainWindow.focus();
        } catch (e) {
          // Browser controls tab focus.
        }

      }


      /*
       * Change the ORIGINAL tab
       * to your second URL.
       */

      window.location.replace(
        MY_LINK
      );

    });


  /*
   * ===============================
   * UNDER 18 BUTTON
   * ===============================
   */

  document
    .getElementById("exitButton")
    .addEventListener("click", function () {

      if (window.history.length > 1) {

        window.history.back();

      } else {

        window.location.replace(
          "about:blank"
        );

      }

    });

</script>

</body>
</html>
