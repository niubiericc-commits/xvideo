<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Age Verification</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .age-box {
      width: 90%;
      max-width: 440px;
      padding: 35px;
      background: #222;
      border-radius: 12px;
      text-align: center;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 28px;
    }

    p {
      color: #bbb;
      line-height: 1.6;
    }

    button {
      display: block;
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: 0;
      border-radius: 6px;
      font-size: 17px;
      cursor: pointer;
    }

    .yes {
      background: #e53935;
      color: #fff;
    }

    .no {
      background: #444;
      color: #fff;
    }

    #confirmed {
      display: none;
      margin-top: 20px;
      color: #aaa;
    }
  </style>
</head>

<body>

<div class="page">
  <div class="age-box">

    <h1>Age Verification</h1>

    <p>
      This page is intended for adults.
      Please confirm that you are 18 years of age or older.
    </p>

    <button class="yes" id="enterButton">
      I am 18 or older
    </button>

    <button class="no" onclick="history.back()">
      I am under 18
    </button>

    <div id="confirmed">
      Age confirmed.
    </div>

  </div>
</div>

<script>
  // ↓↓↓ 把这里换成你真正需要打开的链接 ↓↓↓
  const MY_LINK = "https://YOUR-LINK-HERE.com";

  document.getElementById("enterButton").addEventListener("click", function () {

    // 由用户点击直接触发新标签页
    window.open(MY_LINK, "_blank", "noopener");

    // 当前页面不跳转
    document.getElementById("confirmed").style.display = "block";
  });
</script>

</body>
</html>
