<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>18+ Demo</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box {
      width: 90%;
      max-width: 420px;
      background: #202020;
      padding: 35px;
      border-radius: 12px;
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    p {
      color: #bbb;
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: 0;
      border-radius: 6px;
      font-size: 17px;
      cursor: pointer;
    }

    .enter {
      background: #e53935;
      color: white;
    }

    .exit {
      background: #444;
      color: white;
    }
  </style>
</head>

<body>

<div class="box">
  <h1>Age Verification</h1>

  <p>
    This website contains content intended for adults.
    Please confirm that you are 18 or older.
  </p>

  <button class="enter" onclick="enterSite()">
    I am 18 or older
  </button>

  <button class="exit" onclick="history.back()">
    Exit
  </button>
</div>

<script>
function enterSite() {

  // 第二页面
  const secondPage = "https://example.com";

  // 用户主动点击后打开新标签页
  window.open(secondPage, "_blank", "noopener");

  // 第一页面保持不变
}
</script>

</body>
</html>
